services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nowcast
      POSTGRES_PASSWORD: nowcast
      POSTGRES_DB: nowcast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nowcast"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file: .env.testnet
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
